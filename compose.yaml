services:
  schoology-scheduler:
    image: ghcr.io/suckerfish/schoology_scrape:latest
    container_name: schoology-scheduler
    command: python -u main.py --daemon
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped

  # Read-only SQL browser and JSON API over grades.db. Student data: bound to
  # a Tailscale IP via DATASETTE_BIND (default localhost). Never bind 0.0.0.0.
  datasette:
    image: schoology-datasette:0.65.5
    pull_policy: build
    build: ./datasette
    container_name: schoology-datasette
    volumes:
      - ./data:/data:ro
    ports:
      - "${DATASETTE_BIND:-127.0.0.1}:8001:8001"
    restart: unless-stopped
